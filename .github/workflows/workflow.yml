name: CI - SGAM
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # Quando um pull request for aberto ou atualizado, roda a CI
    types: [opened, reopened, synchronize, ready_for_review]

env:
  JAVA_VERSION: 21
  
jobs:
  # --- ETAPA DE BUILD E TESTE (CI) ---
  lint:
    name: Check code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: JAVA_VERSION
          distribution: temurin
          cache: maven
      - name: Run Checkstyle
        run: mvn validate

  test:
    name: Unit & integration tests
    needs: lint # só vai rodar se a etapa de lint passar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: JAVA_VERSION
          distribution: temurin
          cache: maven
      - name: Run Tests
        run: mvn test jacoco:report -Dspring.profiles.active=test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always() # Garante que o relatório seja salvo mesmo se encontrar falhas
        with:
          name: test-report
          path: target/surefire-reports/

  sonar:
    name: Code quality analysis
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para o Sonar analisar o histórico do Git

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: JAVA_VERSION
          distribution: 'temurin'
          cache: maven

      - name: Sonar analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Gerado automaticamente pelo GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Gerado no painel do Sonar
        run: |
          mvn verify sonar:sonar -DskipTests \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  build:
    name: Build and push application
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sgam:latest

    # --- ETAPA DE SEGURANÇA (APENAS NA MAIN) * ---
  security-scan:
    name: Dependency vulnerability scan
    if: github.ref == 'refs/heads/main' # *
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 'JAVA_VERSION'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency Check
        # Este comando baixa a base de dados de CVEs (Common Vulnerabilities and Exposures) e verifica seu pom.xml
        run: mvn org.owasp:dependency-check-maven:check

      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
        
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/sgam:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

# --- ETAPA DE DEPLOY (CD) ---
#  deploy: # CD da aplicação
#    name: Deploy to production
#
#  destroy: # Facilidade da remocao dos recursos
#    name: Destroy production